<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1f2b66">
<title>Мариям полицейский</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: #0d1030;
    overscroll-behavior: none; touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  }
  canvas { display: block; position: fixed; left: 0; top: 0; touch-action: none; }
  #safe { position: fixed; top: 0; left: 0; width: 0; height: 0; padding-top: env(safe-area-inset-top); visibility: hidden; }
</style>
</head>
<body>
<canvas id="screen"></canvas>
<div id="safe"></div>
<script>
(() => {
'use strict';

// ---------------------------------------------------------------------------
// Canvas: drawn at full device resolution. Game logic works in "world units"
// (~230 units across the short side of the screen); S converts units -> pixels.
// ---------------------------------------------------------------------------
const cv = document.getElementById('screen');
const ctx = cv.getContext('2d');
let S = 4, W = 230, H = 500, DPR = 1, safeTop = 0;
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const FONT = '"Trebuchet MS", "Segoe UI", Roboto, Arial, sans-serif';
const OUT = '#1a1433';

// ---- vector helpers ------------------------------------------------------
function rrPath(c, x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}
function paint(c, fill, stroke, lw) {
  if (fill) { c.fillStyle = fill; c.fill(); }
  if (stroke) { c.strokeStyle = stroke; c.lineWidth = lw || 0.6; c.lineJoin = 'round'; c.stroke(); }
}
function rr(c, x, y, w, h, r, fill, stroke, lw) { rrPath(c, x, y, w, h, r); paint(c, fill, stroke === undefined ? OUT : stroke, lw); }
function el(c, x, y, rx, ry, fill, stroke, lw) {
  c.beginPath(); c.ellipse(x, y, Math.max(0.01, rx), Math.max(0.01, ry), 0, 0, TAU);
  paint(c, fill, stroke === undefined ? OUT : stroke, lw);
}
function lg(c, x0, y0, x1, y1, stops) {
  const g = c.createLinearGradient(x0, y0, x1, y1);
  stops.forEach((s, i) => g.addColorStop(i / (stops.length - 1), s));
  return g;
}
function rg(c, x, y, r0, r1, stops) {
  const g = c.createRadialGradient(x, y, r0, x, y, r1);
  stops.forEach((s, i) => g.addColorStop(i / (stops.length - 1), s));
  return g;
}
function starPath(c, x, y, r, ri, rot) {
  rot = rot === undefined ? -Math.PI / 2 : rot;
  c.beginPath();
  for (let i = 0; i < 10; i++) {
    const rad = i % 2 ? ri : r, a = rot + i * Math.PI / 5;
    c.lineTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad);
  }
  c.closePath();
}
function star(c, x, y, r, fill, stroke, lw, rot) { starPath(c, x, y, r, r * 0.45, rot); paint(c, fill, stroke === undefined ? OUT : stroke, lw || 0.4); }
function line(c, x0, y0, x1, y1, col, lw, cap) {
  c.beginPath(); c.moveTo(x0, y0); c.lineTo(x1, y1);
  c.strokeStyle = col; c.lineWidth = lw; c.lineCap = cap || 'round'; c.stroke();
}
function arcS(c, x, y, r, a0, a1, col, lw) {
  c.beginPath(); c.arc(x, y, r, a0, a1); c.strokeStyle = col; c.lineWidth = lw; c.lineCap = 'round'; c.stroke();
}
function glow(c, color, blur) { c.shadowColor = color; c.shadowBlur = blur * S; }
function noGlow(c) { c.shadowColor = 'transparent'; c.shadowBlur = 0; }
function text(str, x, y, size, fill, align, strokeW) {
  ctx.font = `bold ${size}px ${FONT}`;
  ctx.textAlign = align || 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  if (strokeW !== 0) { ctx.strokeStyle = OUT; ctx.lineWidth = size * (strokeW || 0.22); ctx.strokeText(str, x, y); }
  ctx.fillStyle = fill; ctx.fillText(str, x, y);
}
function tinyText(c, str, x, y, size, fill) {
  c.font = `bold ${size}px ${FONT}`; c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillStyle = fill; c.fillText(str, x, y);
}
function badge(c, x, y, r) {
  c.beginPath();
  c.moveTo(x, y - r); c.lineTo(x + r * 0.9, y - r * 0.6); c.lineTo(x + r * 0.8, y + r * 0.3);
  c.quadraticCurveTo(x + r * 0.5, y + r * 0.9, x, y + r * 1.1);
  c.quadraticCurveTo(x - r * 0.5, y + r * 0.9, x - r * 0.8, y + r * 0.3);
  c.lineTo(x - r * 0.9, y - r * 0.6); c.closePath();
  paint(c, lg(c, x, y - r, x, y + r, ['#fff3b0', '#f5c534', '#b8860b']), OUT, 0.35);
  star(c, x, y + 0.05 * r, r * 0.5, '#1f2b66', null);
}
function heartPath(c, x, y, s) {
  c.beginPath();
  c.moveTo(x, y + s * 0.9);
  c.bezierCurveTo(x - s * 1.4, y - s * 0.1, x - s * 0.8, y - s * 1.1, x, y - s * 0.4);
  c.bezierCurveTo(x + s * 0.8, y - s * 1.1, x + s * 1.4, y - s * 0.1, x, y + s * 0.9);
  c.closePath();
}

// ---------------------------------------------------------------------------
// Palette
// ---------------------------------------------------------------------------
const C = {
  S: '#eab07a', S2: '#d99560', H: '#6b3a1c', Hm: '#7d4523', h: '#43220e',
  lime: '#b6f23c', limeD: '#7ec41c', navy: '#22306e'
};
const skinGrad = (c, x, y, r) => rg(c, x - r * 0.25, y - r * 0.3, r * 0.1, r * 1.25, ['#f8cfa3', '#eab07a', '#d38f5b']);
const hairGrad = (c, y0, y1) => lg(c, 0, y0, 0, y1, ['#8c5530', '#6b3a1c', '#4e2913']);
const navyGrad = (c, y0, y1) => lg(c, 0, y0, 0, y1, ['#3a4ca3', '#24316f', '#18215a']);

// ---------------------------------------------------------------------------
// Mariyam (girl cop). Origin = point between the feet. Returns gun shoulder.
// ---------------------------------------------------------------------------
function braid(c, x0, y0, sway) {
  const n = 8;
  for (let i = 0; i < n; i++) {
    const k = i / (n - 1), bx = x0 + sway * k * k * 4, by = y0 + i * 2.05;
    if (i === n - 2) { rr(c, bx - 1.8, by - 0.9, 3.6, 1.9, 0.8, lg(c, 0, by - 1, 0, by + 1, [C.lime, C.limeD]), OUT, 0.4); continue; }
    if (i === n - 1) {
      c.beginPath(); c.moveTo(bx - 1.6, by - 0.9);
      c.quadraticCurveTo(bx - 2.1, by + 2.2, bx - 0.5, by + 3.1);
      c.quadraticCurveTo(bx + 0.1, by + 1.8, bx + 0.6, by + 3.2);
      c.quadraticCurveTo(bx + 2.2, by + 2, bx + 1.6, by - 0.9);
      c.closePath(); paint(c, C.Hm, OUT, 0.4);
      continue;
    }
    el(c, bx, by, 2.1 - k * 0.35, 1.45, i % 2 ? C.H : C.Hm, OUT, 0.4);
    line(c, bx - 1, by - 0.3, bx + 0.6, by + 0.5, C.h, 0.35);
  }
}
function girlCap(c, cy, back) {
  el(c, 0, cy - 1.6, 10.6, 4.6, lg(c, 0, cy - 6, 0, cy + 2, ['#4153ad', '#22306e']));
  rr(c, -10.2, cy - 1.8, 20.4, 4.6, 1.4, lg(c, 0, cy - 2, 0, cy + 3, ['#2d3c88', '#1b2560']));
  el(c, -4, cy - 3.6, 3.5, 1.1, 'rgba(255,255,255,0.18)', null);
  rr(c, -10.2, cy + 1.4, 20.4, 1.4, 0.5, back ? '#141b45' : lg(c, 0, cy + 1.4, 0, cy + 2.8, ['#fff1a6', '#f5c534', '#c9971c']), OUT, 0.35);
  if (!back) {
    el(c, -9.3, cy + 2.1, 0.75, 0.75, '#fff1a6', OUT, 0.3); el(c, 9.3, cy + 2.1, 0.75, 0.75, '#fff1a6', OUT, 0.3);
    el(c, 0, cy + 3.7, 10.8, 1.9, lg(c, 0, cy + 2, 0, cy + 5.5, ['#2a2f45', '#0d1028']));
    line(c, -6.5, cy + 3.1, 6.5, cy + 3.1, 'rgba(255,255,255,0.22)', 0.4);
    badge(c, 0, cy - 1.8, 2.8);
  } else {
    el(c, 0, cy - 6, 1, 0.6, '#3a4ca3', OUT, 0.3);
    line(c, 0, cy - 5.4, 0, cy + 1, 'rgba(0,0,0,0.25)', 0.35);
  }
}
function drawGirl(c, view, ph, run, br, happy) {
  const bob = run ? -Math.abs(Math.sin(ph)) * 1.1 : br * 0.5;
  const sway = run ? Math.sin(ph) * 1.1 : Math.sin(performance.now() / 700) * 0.2;
  if (view === 'side') return girlSide(c, ph, run, bob, sway);
  const back = view === 'back';
  // legs + boots
  for (const s of [-1, 1]) {
    const lift = run ? Math.max(0, Math.sin(ph + (s > 0 ? Math.PI : 0))) * 3 : 0, lx = s * 4.3;
    rr(c, lx - 3, -15, 6, 10.5 - lift, 1.6, lg(c, 0, -15, 0, -4, ['#27347a', '#18204d']));
    if (!back) {
      rr(c, lx + s * 1.3 - 1.4, -12, 2.8, 3.2, 0.6, '#1a2250', OUT, 0.35);
      line(c, lx + s * 1.3 - 1.3, -11.2, lx + s * 1.3 + 1.3, -11.2, '#3a4ca3', 0.4, 'butt');
    } else rr(c, lx - 2, -13.8, 4, 2.2, 0.5, '#1a2250', OUT, 0.35);
    rr(c, lx - 3.3, -5.6 - lift, 6.6, 5.6, 1.8, lg(c, 0, -5.6 - lift, 0, -lift, ['#4a4a55', '#121216']));
    rr(c, lx - 3.4, -1.1 - lift, 6.8, 1.3, 0.6, '#0a0a0d', OUT, 0.3);
    if (!back) {
      line(c, lx - 1, -4.6 - lift, lx + 1, -3.8 - lift, '#d6dae4', 0.35);
      line(c, lx - 1, -3.4 - lift, lx + 1, -2.6 - lift, '#d6dae4', 0.35);
    }
  }
  rr(c, -8.3, -16, 16.6, 3.4, 1.5, '#1f2a62');
  // torso
  const ty = -25.5 + bob;
  for (const s of [-1, 1]) {
    rr(c, s > 0 ? 6.4 : -11.4, ty + 0.2, 5, 5.6, 2.2, navyGrad(c, ty, ty + 6));
    const cx = s * 8.9, cy = ty + 2.6;
    c.beginPath(); c.moveTo(cx - 1.3, cy - 1.2); c.lineTo(cx + 1.3, cy - 1.2); c.lineTo(cx + 1.3, cy + 0.4); c.lineTo(cx, cy + 1.5); c.lineTo(cx - 1.3, cy + 0.4); c.closePath();
    paint(c, '#f5c534', OUT, 0.35);
    star(c, cx, cy - 0.1, 0.8, '#1f2b66', null);
  }
  rr(c, -8.6, ty, 17.2, 11.8, 3.2, navyGrad(c, ty, ty + 12));
  if (!back) {
    c.beginPath(); c.moveTo(-2.2, ty); c.lineTo(0, ty + 2.6); c.lineTo(2.2, ty); c.closePath(); paint(c, C.S2, null);
    for (const s of [-1, 1]) {
      c.beginPath(); c.moveTo(s * 3.6, ty - 0.2); c.lineTo(s * 0.2, ty + 2.8); c.lineTo(s * 2.6, ty + 3.4); c.lineTo(s * 4.6, ty + 0.6); c.closePath();
      paint(c, '#3f52ab', OUT, 0.35);
    }
    line(c, 0, ty + 2.8, 0, ty + 11.5, '#141b45', 0.5);
    for (let i = 0; i < 3; i++) el(c, 0.9, ty + 4 + i * 2.6, 0.35, 0.35, '#c9a227', null);
    rr(c, -7, ty + 4.2, 5.6, 2.1, 0.4, '#0e1336', null);
    tinyText(c, 'POLICE', -4.2, ty + 5.3, 1.5, '#ffffff');
    star(c, 4.3, ty + 5.2, 1.8, lg(c, 0, ty + 3.4, 0, ty + 7, ['#fff1a6', '#f5c534', '#b8860b']), OUT, 0.35);
    line(c, -6.6, ty + 7.8, -2.6, ty + 7.8, '#141b45', 0.45);
    line(c, 2.6, ty + 7.8, 6.6, ty + 7.8, '#141b45', 0.45);
  } else {
    rr(c, -7.2, ty + 3.2, 14.4, 5, 1, '#0e1336', null);
    tinyText(c, 'POLICE', 0, ty + 5.8, 3.6, '#ffffff');
  }
  // belt, pouches, cuffs
  rr(c, -8.6, -15, 17.2, 2.8, 0.9, '#1b1b22');
  for (const s of [-1, 1]) rr(c, s * 6.4 - 1.9, -15.4, 3.8, 4.6, 0.9, lg(c, 0, -15.4, 0, -11, ['#44444f', '#1e1e26']));
  if (!back) {
    rr(c, -1.7, -15.3, 3.4, 3.3, 0.6, lg(c, 0, -15.3, 0, -12, ['#ffffff', '#aeb4c2']), OUT, 0.4);
    rr(c, -0.8, -14.4, 1.6, 1.5, 0.3, '#1b1b22', null);
    for (const [x, y] of [[-3.8, -10.2], [-2, -9.1]]) {
      arcS(c, x, y, 1.3, 0, TAU, OUT, 1.1);
      arcS(c, x, y, 1.3, 0, TAU, '#e3e7ef', 0.6);
    }
  }
  // free arm
  const sw = run ? Math.sin(ph) * 1.2 : 0, ax = back ? -9.8 : 9.8;
  rr(c, ax - 1.5, ty + 5.2 + sw, 3, 5.6, 1.5, C.S);
  el(c, ax, ty + 11.4 + sw, 1.9, 1.8, C.S);
  // head
  const hy = -32 + bob;
  if (!back) {
    el(c, 0, hy - 1, 11, 10.6, hairGrad(c, hy - 11, hy + 10));
    for (const s of [-1, 1]) el(c, s * 9.5, hy + 2.5, 2.4, 5.2, C.Hm);
    for (const s of [-1, 1]) el(c, s * 9.1, hy + 0.6, 1.6, 2.1, C.S);
    el(c, 0, hy + 0.4, 8.9, 8.6, skinGrad(c, 0, hy, 9));
    c.beginPath(); c.moveTo(-9.6, hy + 1);
    c.quadraticCurveTo(-9.5, hy - 8, 0, hy - 8.6); c.quadraticCurveTo(9.5, hy - 8, 9.6, hy + 1);
    c.quadraticCurveTo(8.4, hy - 3.5, 5.6, hy - 4.2); c.quadraticCurveTo(3, hy - 2.6, 1.2, hy - 4.6);
    c.quadraticCurveTo(-1.5, hy - 2.8, -4.2, hy - 4.4); c.quadraticCurveTo(-7.8, hy - 3.6, -9.6, hy + 1);
    c.closePath(); paint(c, hairGrad(c, hy - 9, hy - 2), OUT, 0.5);
    line(c, -3, hy - 7, -5, hy - 5, 'rgba(255,220,180,0.35)', 0.5);
    for (const s of [-1, 1]) {
      const ex = s * 3.7, ey = hy + 1.3;
      if (happy) {
        arcS(c, ex, ey + 1, 1.9, Math.PI * 1.1, Math.PI * 1.9, '#2e1a0e', 0.8);
        el(c, s * 5.8, hy + 4.2, 1.8, 1.1, 'rgba(242,110,100,0.65)', null);
        continue;
      }
      el(c, ex, ey, 1.95, 2.45, '#2e1a0e', null);
      el(c, ex, ey + 0.9, 1.4, 1.3, '#7a4524', null);
      el(c, ex - 0.6, ey - 0.9, 0.75, 0.75, '#ffffff', null);
      el(c, ex + 0.7, ey + 0.8, 0.35, 0.35, '#ffffff', null);
      arcS(c, ex, ey + 0.2, 2.3, Math.PI * 1.15, Math.PI * 1.85, '#2e1a0e', 0.5);
      line(c, ex + s * 1.9, ey - 1.3, ex + s * 2.6, ey - 2, '#2e1a0e', 0.4);
      el(c, s * 5.8, hy + 4.2, 1.6, 0.95, 'rgba(242,120,110,0.5)', null);
    }
    arcS(c, 0, hy + 3, 0.6, 0.2 * Math.PI, 0.8 * Math.PI, '#c47a4a', 0.35);
    if (happy) {
      c.beginPath(); c.moveTo(-3, hy + 4.3); c.quadraticCurveTo(0, hy + 9.2, 3, hy + 4.3); c.closePath();
      paint(c, '#8a2a2a', '#5a1a1a', 0.4);
      el(c, 0, hy + 6.6, 1.5, 0.8, '#ff7a8a', null);
      rr(c, -2.2, hy + 4.3, 4.4, 0.9, 0.3, '#ffffff', null);
    } else {
    c.beginPath(); c.moveTo(-2, hy + 4.7); c.quadraticCurveTo(0, hy + 7, 2, hy + 4.7); c.quadraticCurveTo(0, hy + 5.7, -2, hy + 4.7);
    c.closePath(); paint(c, '#b4473f', '#7a2b25', 0.35);
    }
  } else {
    el(c, 0, hy - 0.5, 10.8, 10.4, hairGrad(c, hy - 11, hy + 10));
    line(c, 0, hy - 9.5, 0, hy + 8, '#45230f', 0.5);
    for (const s of [-1, 1]) for (let k = 0; k < 3; k++) {
      c.beginPath(); c.moveTo(s * (1.8 + k * 2.6), hy - 8.6 + k);
      c.quadraticCurveTo(s * (3.6 + k * 2.6), hy, s * (3 + k * 2.4), hy + 8);
      c.strokeStyle = '#4f2912'; c.lineWidth = 0.35; c.stroke();
    }
    rr(c, -2.2, hy + 8.6, 4.4, 2, 0.8, C.S2, null);
  }
  girlCap(c, hy - 8.2, back);
  for (const s of [-1, 1]) braid(c, s * (back ? 7.6 : 9.8), hy + (back ? 5 : 6.5), sway * (back ? 0.6 : 1));
  return back ? [9.4, ty + 2.8] : [-9.4, ty + 2.8];
}
function sideLeg(c, a, far, robot) {
  c.save(); c.translate(0, -14.5); c.rotate(a);
  if (robot) {
    rr(c, -2.8, 0, 5.6, 9.5, 1.8, far ? '#163b9c' : lg(c, 0, 0, 0, 9, ['#2a62e0', '#163b9c']));
    if (!far) { glow(c, '#5ad0ff', 3); el(c, 1.6, 3.4, 1, 1.4, '#5ad0ff', null); noGlow(c); }
    rr(c, -3.2, 8.4, 8, 5.4, 2, far ? '#0b0c10' : lg(c, 0, 8.4, 0, 13.8, ['#2b2f3a', '#0d0e12']));
    rr(c, -2.4, 11.4, 6, 0.9, 0.4, far ? '#2a8fd0' : '#5ad0ff', null);
  } else {
    rr(c, -2.6, 0, 5.2, 9.5, 1.6, far ? '#18204d' : lg(c, 0, 0, 0, 9, ['#27347a', '#1a2250']));
    if (!far) rr(c, -1.2, 2.4, 3, 3, 0.6, '#1a2250', OUT, 0.3);
    rr(c, -2.8, 8.6, 7.4, 5, 1.8, far ? '#0e0e12' : lg(c, 0, 8.6, 0, 13.6, ['#4a4a55', '#121216']));
    rr(c, -2.9, 12.6, 7.6, 1.2, 0.5, '#060608', OUT, 0.3);
    if (!far) line(c, 0.4, 9.9, 2.4, 9.9, '#d6dae4', 0.35);
  }
  c.restore();
}
function girlSide(c, ph, run, bob, sway) {
  const legA = run ? Math.sin(ph) * 0.55 : 0, armA = run ? -Math.sin(ph) * 0.6 : 0.1;
  const ty = -25.5 + bob, hy = -32 + bob;
  c.save(); c.translate(-0.5, ty + 3.5); c.rotate(armA);
  rr(c, -1.3, 0, 2.6, 6, 1.3, C.S2); el(c, 0, 6.4, 1.7, 1.6, C.S2); c.restore();
  sideLeg(c, -legA, true); sideLeg(c, legA, false);
  rr(c, -7.8, ty + 3.6, 2.2, 4.6, 0.6, '#2a2a30'); line(c, -7.2, ty + 3.6, -7.2, ty + 1.2, '#2a2a30', 0.6);
  rr(c, -6.2, ty, 12.4, 11.8, 3.2, navyGrad(c, ty, ty + 12));
  rr(c, -6.4, -15, 12.8, 2.8, 0.9, '#1b1b22');
  rr(c, -8, -15.4, 3, 4.4, 0.9, '#33333d');
  arcS(c, 5, -10.6, 1.3, 0, TAU, OUT, 1.1); arcS(c, 5, -10.6, 1.3, 0, TAU, '#e3e7ef', 0.6);
  rr(c, 2.2, ty + 4, 3.4, 1.6, 0.3, '#0e1336', null);
  rr(c, -2.6, ty + 0.2, 5.6, 5.8, 2.2, navyGrad(c, ty, ty + 6));
  c.beginPath(); c.moveTo(-1, ty + 1.6); c.lineTo(1.6, ty + 1.6); c.lineTo(1.6, ty + 3.2); c.lineTo(0.3, ty + 4.3); c.lineTo(-1, ty + 3.2); c.closePath();
  paint(c, '#f5c534', OUT, 0.35);
  braid(c, -7.6, hy + 4, -0.6 + sway * -0.8 - (run ? 1 : 0));
  el(c, -1.8, hy - 1, 9.8, 10.2, hairGrad(c, hy - 11, hy + 9));
  el(c, 2.4, hy + 0.6, 7.6, 8.4, skinGrad(c, 3, hy, 8.5));
  el(c, 9.4, hy + 1.8, 1.2, 1.05, '#eebb8a', OUT, 0.35);

  power() { [392, 523, 659, 784, 1047, 1319].forEach((f, i) => tone('square', f, f * 1.02, 0.07, 0.05, i * 0.05)); },

  apple() { [784, 988, 1175, 1568].forEach((f, i) => tone('triangle', f, f, 0.08, 0.06, i * 0.06)); },
  cheer() { [1047, 1319, 1568, 2093].forEach((f, i) => tone('square', f, f, 0.08, 0.04, i * 0.07)); },
  shieldHit() { tone('sine', 1800, 1200, 0.05, 0.03); },
  bossDown() { noise(0.5, 0.3, 800); [523, 659, 784, 1047, 1319, 1568].forEach((f, i) => tone('square', f, f, 0.12, 0.06, 0.15 + i * 0.09)); },

};

// ---------------------------------------------------------------------------
// Game state
// ---------------------------------------------------------------------------
const SPEED = 78, FIRE_EVERY = 0.3;
const WAVES = 45, WAVES_PER_CHAPTER = 5;
const ENERGY_TIME = 8, ENERGY_BOOST = 1.6;
const CEL_TIME = 5.5;          // Mariyam's victory cheer (voice clip is ~5 s)
const POWER_CD = 10, POWER_TIME = { girl: 15, robot: 8 };
let state = 'menu';             // menu | play | pause | dying | over | win
let T = 0, score = 0, best = 0, bestWave = 0, newBest = false, spawnT = 0, fireT = 0, stateT = 0, shakeT = 0;
let wave = 1, toSpawn = 0, waveClear = false, waveT = 0, shotN = 0, shieldA = 0, shieldFireT = 0;
let bossPending = false, boss = null, bossIntroT = 0, appleItem = null, appleT = 12;
let pauseBtn = { x: 0, y: 0, r: 9 };
let enemies = [], bullets = [], parts = [], coins = [];
let powerBtn = { x: 0, y: 0, r: 16 }, buttons = [];
let hero = 'girl';
try { if (HEROES[localStorage.getItem('policeGirl.hero')]) hero = localStorage.getItem('policeGirl.hero'); } catch (e) { /* storage unavailable */ }
const P = { x: 100, y: 200, view: 'front', flip: false, ph: 0, run: false, lives: 3, inv: 0, gunA: Math.PI / 2, flash: 0, pow: 0, cd: 0, sh: [100, 180], energy: 0, cel: 0 };
const ptr = { active: false, id: null, lx: 0, ly: 0, dx: 0, dy: 0, last: 0 };
try {
  best = parseInt(localStorage.getItem('policeGirl.best') || '0', 10) || 0;
  bestWave = parseInt(localStorage.getItem('policeGirl.bestWave') || '0', 10) || 0;
} catch (e) { best = 0; bestWave = 0; }

const chapterOf = n => Math.ceil(n / WAVES_PER_CHAPTER);
const themeOf = n => (chapterOf(n) - 1) % THEMES.length;
const waveCount = n => 8 + Math.floor((n - 1) * 52 / (WAVES - 1));
const waveSpeed = n => Math.min(72, 20 + (n - 1) * 1.18);       // faster every wave
const waveGap = n => Math.max(0.22, 1.4 - (n - 1) * 0.027);
const thiefHp = n => n >= 30 ? 3 : (n >= 10 ? 2 : 1);           // bullets needed per thief
const breath = () => (Math.sin(performance.now() / 260) + 1) / 2;

function startWave(n) {
  wave = n; toSpawn = waveCount(n); spawnT = 1.8; waveClear = false; waveT = 0;
  bossPending = n % WAVES_PER_CHAPTER === 0; boss = null;
  if (themeOf(n) !== bgTheme) buildBg(themeOf(n));
}
function startGame() {
  enemies = []; bullets = []; parts = []; coins = []; appleItem = null; appleT = rand(10, 16);
  score = 0; T = 0; fireT = 0; newBest = false;
  Object.assign(P, { x: W / 2, y: Math.round(H * 0.62), view: 'front', flip: false, ph: 0, run: false, lives: 3, inv: 0, gunA: Math.PI / 2, flash: 0, pow: 0, cd: 0, energy: 0, cel: 0 });
  ptr.active = false;
  state = 'play'; stateT = 0;
  startWave(1);
  sfx.start();
}
function endGame(won) {
  state = won ? 'win' : 'over'; stateT = 0;
  const reached = won ? WAVES : wave;
  if (score > best) { best = score; newBest = true; }
  if (reached > bestWave) bestWave = reached;
  try {
    localStorage.setItem('policeGirl.best', String(best));
    localStorage.setItem('policeGirl.bestWave', String(bestWave));
  } catch (e) { /* storage unavailable */ }
  if (won) sfx.win(); else sfx.over();
}
function pauseGame() { if (state === 'play') { state = 'pause'; ptr.active = false; } }
function resumeGame() { if (state === 'pause') { state = 'play'; last = performance.now(); } }
function toMenu() {
  state = 'menu'; stateT = 0; enemies = []; bullets = []; coins = []; boss = null; appleItem = null;
  if (bgTheme !== 0) buildBg(0);
}
function activatePower() {
  if (state !== 'play' || P.pow > 0 || P.cd > 0) return;
  P.pow = POWER_TIME[hero]; shieldFireT = 0;
  sfx.power();
}
function hurtPlayer() {
  if (P.pow > 0 || P.inv > 0) return;
  P.lives--; P.inv = 1.5; shakeT = 0.3; sfx.hurt();
  if (P.lives <= 0) { state = 'dying'; stateT = 0; ptr.active = false; P.run = false; }
}

function puff(x, y, big) {
  const k = big ? 2.2 : 1;
  for (let i = 0; i < 8 * k; i++) parts.push({ t: 'c', x: x + rand(-6, 6) * k, y: y + rand(-7, 5) * k, vx: rand(-18, 18) * k, vy: rand(-24, 4) * k, r: rand(3, 6) * k, life: 0, max: rand(0.35, 0.55) * (big ? 1.4 : 1) });
  for (let i = 0; i < 6 * k; i++) {
    const a = i / (6 * k) * TAU + rand(-0.3, 0.3), v = rand(45, 80) * (big ? 1.3 : 1);
    parts.push({ t: 's', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 25, life: 0, max: rand(0.5, 0.75), s: Math.floor(rand(0, 4)), rot: rand(0, TAU) });
  }
  sfx.puff();
}
function spawnEnemy(spd, nearX, nearY) {
  let x, y;
  if (nearX !== undefined) { x = nearX + rand(-20, 20); y = nearY + rand(-6, 10); }
  else {
    const side = Math.floor(Math.random() * 4);
    if (side === 0) { x = rand(10, W - 10); y = -2; }
    else if (side === 1) { x = W + 14; y = rand(playTop + 20, H); }
    else if (side === 2) { x = rand(10, W - 10); y = H + 34; }
    else { x = -14; y = rand(playTop + 20, H); }
  }
  const hp = thiefHp(wave);
  enemies.push({ x, y, v: Math.floor(Math.random() * THIEF_V.length), spd: spd * rand(0.85, 1.15), ph: Math.random() * TAU, flip: false, hp, max: hp, flash: 0 });
}
function spawnBoss() {
  const tier = Math.min(BOSSES.length - 1, chapterOf(wave) - 1), B = BOSSES[tier];
  const sc = tier === BOSSES.length - 1 ? 2.8 : 2 + tier * 0.08;
  boss = { tier, x: W / 2, y: -6, hp: B.hp, max: B.hp, shield: B.shield || 0, maxShield: B.shield || 0, sflash: 0,
    sc, spd: 16 + tier * 0.9, ph: 0, atkT: 2.5, atkN: 0, dashT: 0, flash: 0, flip: false };
  bossIntroT = 0;
  sfx.boss();
}
function bossAttack() {
  const b = boss, tier = b.tier;
  b.atkN++;
  if (tier >= 2 && b.atkN % 3 === 0) {
    for (let i = 0; i < 2 + Math.min(tier, 4); i++) spawnEnemy(waveSpeed(wave) * 0.9, b.x, b.y);
    return;
  }
  if (tier >= 1 && b.atkN % 2 === 0) { b.dashT = 0.7; return; }
  const n = 5 + Math.round(Math.min(tier, 6) * 1.5), spread = 1 + 0.12 * Math.min(tier, 6), base = Math.atan2(P.y - 18 - (b.y - 16 * b.sc), P.x - b.x);
  for (let i = 0; i < n; i++) {
    const a = base - spread / 2 + spread * i / (n - 1), v = 55 + Math.min(tier, 6) * 6;
    coins.push({ x: b.x, y: b.y - 16 * b.sc, vx: Math.cos(a) * v, vy: Math.sin(a) * v, rot: rand(0, TAU) });
  }
  sfx.coins();
}
function killBoss() {
  const b = boss;
  for (let i = 0; i < 4; i++) setTimeout(() => puff(b.x + rand(-14, 14), b.y - 16 * b.sc + rand(-14, 14), true), i * 120);
  for (let i = 0; i < 24; i++) parts.push({ t: 'coin', x: b.x, y: b.y - 16 * b.sc, vx: rand(-80, 80), vy: rand(-120, -30), life: 0, max: rand(0.9, 1.4), rot: rand(0, TAU) });
  score += 10 * (b.tier + 1);
  boss = null; coins = [];
  shakeT = 0.4;
  sfx.bossDown();
  if (hero === 'girl') { P.cel = CEL_TIME; P.view = 'front'; ptr.active = false; setTimeout(() => { sfx.cheer(); playVoice(); }, 350); }
}

function angleTo(a, b, k) {
  let d = b - a;
  while (d > Math.PI) d -= TAU;
  while (d < -Math.PI) d += TAU;
  return a + d * k;
}

function update(dt, now) {
  if (state === 'pause') return;
  stateT += dt;
  if (shakeT > 0) shakeT -= dt;

  if (state === 'play') {
    T += dt; waveT += dt;
    // super power timers
    if (P.pow > 0) { P.pow -= dt; if (P.pow <= 0) { P.pow = 0; P.cd = POWER_CD; } }
    else if (P.cd > 0) { P.cd -= dt; if (P.cd <= 0) { P.cd = 0; sfx.ready(); } }
    const girlPower = hero === 'girl' && P.pow > 0, robotPower = hero === 'robot' && P.pow > 0;
    if (P.energy > 0) {
      P.energy -= dt;
      if (Math.random() < 0.4) parts.push({ t: 'g', x: P.x + rand(-6, 6), y: P.y - rand(0, 6), vx: rand(-8, 8), vy: rand(-25, -10), life: 0, max: 0.5 });
    }
    if (P.cel > 0) P.cel -= dt;
    const speed = SPEED * Math.max(girlPower ? 1.5 : 1, P.energy > 0 ? ENERGY_BOOST : 1);

    // movement: run while the finger keeps moving (not while celebrating)
    P.run = P.cel <= 0 && ptr.active && now - ptr.last < 130;
    if (P.run) {
      P.x += ptr.dx * speed * dt; P.y += ptr.dy * speed * dt;
      P.x = Math.max(10, Math.min(W - 10, P.x));
      P.y = Math.max(playTop + 44, Math.min(H - 2, P.y));
      P.ph += dt * 12;
      if (Math.abs(ptr.dx) > Math.abs(ptr.dy)) { P.view = 'side'; P.flip = ptr.dx < 0; }
      else P.view = ptr.dy > 0 ? 'front' : 'back';
    }
    if (P.inv > 0) P.inv -= dt;
    if (P.flash > 0) P.flash -= dt;

    // waves & bosses
    if (!waveClear) {
      spawnT -= dt;
      if (toSpawn > 0 && spawnT <= 0) {
        spawnEnemy(waveSpeed(wave)); toSpawn--;
        if (toSpawn > 0 && wave >= 8 && Math.random() < Math.min(0.5, 0.03 * wave)) { spawnEnemy(waveSpeed(wave)); toSpawn--; }
        spawnT = waveGap(wave);
      }
      if (toSpawn === 0 && enemies.length === 0 && !boss) {
        if (bossPending) { bossPending = false; spawnBoss(); }
        else {
          if (wave >= WAVES) { endGame(true); return; }
          waveClear = true; waveT = 0; coins = [];
          if (P.lives < 3) P.lives++;
          sfx.wave();
        }
      }
    } else if (waveT > 2.4) startWave(wave + 1);

    // bonus apple: drops from the sky, lies on the road for 10 s
    appleT -= dt;
    if (!appleItem && appleT <= 0 && !waveClear) {
      const tx = rand(16, W - 16), ty = rand(playTop + 50, H - 30);
      appleItem = { x: tx, y: -10, ty, vy: 0, life: 10, landed: false };
      appleT = rand(14, 22);
    }
    if (appleItem) {
      const a = appleItem;
      if (!a.landed) {
        a.vy += 320 * dt; a.y += a.vy * dt;
        if (a.y >= a.ty) { a.y = a.ty; a.vy = -a.vy * 0.4; if (Math.abs(a.vy) < 25) { a.landed = true; a.vy = 0; } }
      } else {
        a.life -= dt;
        if (a.life <= 0) appleItem = null;
      }
      if (appleItem && Math.hypot(a.x - P.x, a.y - (P.y - 6)) < 14) {
        appleItem = null; P.energy = ENERGY_TIME; sfx.apple();
        for (let i = 0; i < 12; i++) parts.push({ t: 'g', x: a.x, y: a.y, vx: rand(-50, 50), vy: rand(-60, 10), life: 0, max: 0.6 });
      }
    }

    // thieves walk toward the hero
    for (const e of enemies) {
      if (e.flash > 0) e.flash -= dt;
      const dx = P.x - e.x, dy = P.y - e.y, d = Math.hypot(dx, dy) || 1;
      e.x += dx / d * e.spd * dt; e.y += dy / d * e.spd * dt;
      e.flip = dx < 0;
      e.ph += dt * (6 + e.spd / 8);
    }
    for (let i = 0; i < enemies.length; i++) for (let j = i + 1; j < enemies.length; j++) {
      const a = enemies[i], b = enemies[j], dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy);
      if (d > 0 && d < 12) { const p = (12 - d) / 2, nx = dx / d, ny = dy / d; a.x -= nx * p; a.y -= ny * p; b.x += nx * p; b.y += ny * p; }
    }

    // boss
    if (boss) {
      const b = boss;
      bossIntroT += dt;
      const dx = P.x - b.x, dy = P.y - b.y, d = Math.hypot(dx, dy) || 1;
      if (b.dashT > 0) b.dashT -= dt;
      const sp = b.y < playTop + 30 ? 30 : b.spd * (b.dashT > 0 ? 3.5 : 1);
      if (d > 6) { b.x += dx / d * sp * dt; b.y += dy / d * sp * dt; }
      b.flip = dx < 0; b.ph += dt * (b.dashT > 0 ? 14 : 6);
      if (b.flash > 0) b.flash -= dt;
      if (b.sflash > 0) b.sflash -= dt;
      b.atkT -= dt;
      if (b.atkT <= 0 && b.y > playTop + 30) { b.atkT = Math.max(1.4, 3.2 - b.tier * 0.2); bossAttack(); }
      if (Math.hypot(b.x - P.x, (b.y - 14 * b.sc) - (P.y - 18)) < 7 * b.sc + 8) hurtPlayer();
    }
    // boss coins
    for (let i = coins.length - 1; i >= 0; i--) {
      const k = coins[i];
      k.x += k.vx * dt; k.y += k.vy * dt; k.rot += dt * 10;
      if (Math.hypot(k.x - P.x, k.y - (P.y - 18)) < 8) { coins.splice(i, 1); hurtPlayer(); continue; }
      if (k.x < -10 || k.x > W + 10 || k.y < -10 || k.y > H + 10) coins.splice(i, 1);
    }

    // aim & auto-fire at the nearest target on screen
    const [sx, sy] = P.sh;
    let tx = 0, ty = 0, td = 1e9, has = false;
    const consider = (x, y) => {
      if (x < 0 || x > W || y < 0 || y > H) return;
      const d = Math.hypot(x - sx, y - sy);
      if (d < td) { td = d; tx = x; ty = y; has = true; }
    };
    for (const e of enemies) consider(e.x, e.y - 14);
    if (boss) consider(boss.x, boss.y - 14 * boss.sc);
    const want = has ? Math.atan2(ty - sy, tx - sx)
      : (P.view === 'side' ? (P.flip ? Math.PI : 0) : (P.view === 'front' ? Math.PI / 2 : -Math.PI / 2));
    P.gunA = angleTo(P.gunA, want, Math.min(1, dt * 18));
    fireT -= dt;
    if (has && fireT <= 0 && (girlPower || Math.abs(angleTo(0, want - P.gunA, 1)) < 0.35)) {
      fireT = girlPower ? 0.05 : FIRE_EVERY;
      const c = Math.cos(P.gunA), s = Math.sin(P.gunA), fy = c < 0 ? -1 : 1, [mx, my] = HEROES[hero].muzzle;
      const ox = sx + c * mx - s * my * fy, oy = sy + s * mx + c * my * fy;
      const spread = girlPower ? [-0.18, 0, 0.18] : [0];
      for (const da of spread) {
        const a = P.gunA + da + (girlPower ? rand(-0.05, 0.05) : 0);
        bullets.push({ x: ox, y: oy, vx: Math.cos(a) * 260, vy: Math.sin(a) * 260, k: girlPower ? 'o' : HEROES[hero].bullet });
      }
      P.flash = 0.06; shotN++;
      if (!girlPower || shotN % 3 === 0) { if (hero === 'robot') sfx.laser(); else sfx.shoot(); }
    }

    // robot power: orbiting police shields that shoot outward
    if (robotPower) {
      shieldA += dt * 2.6; shieldFireT -= dt;
      const fire = shieldFireT <= 0;
      if (fire) shieldFireT = 0.35;
      for (let k = 0; k < 6; k++) {
        const a = shieldA + k * Math.PI / 3, hx = P.x + Math.cos(a) * 25, hy = P.y - 18 + Math.sin(a) * 25;
        if (fire) bullets.push({ x: hx, y: hy, vx: Math.cos(a) * 200, vy: Math.sin(a) * 200, k: 'c' });
        for (let j = enemies.length - 1; j >= 0; j--) {
          const e = enemies[j];
          if (Math.hypot(e.x - hx, (e.y - 14) - hy) < 10) { enemies.splice(j, 1); puff(e.x, e.y - 14); score++; }
        }
        for (let j = coins.length - 1; j >= 0; j--) if (Math.hypot(coins[j].x - hx, coins[j].y - hy) < 8) coins.splice(j, 1);
      }
      if (fire) sfx.laser();
    }

    // bullets
    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      b.x += b.vx * dt; b.y += b.vy * dt;
      let hit = false;
      for (let j = enemies.length - 1; j >= 0; j--) {
        const e = enemies[j];
        if (Math.hypot(b.x - e.x, b.y - (e.y - 14)) < 10) {
          hit = true; e.hp--;
          if (e.hp <= 0) { enemies.splice(j, 1); puff(e.x, e.y - 14); score++; }
          else { e.flash = 0.1; parts.push({ t: 'p', x: b.x, y: b.y, vx: rand(-30, 30), vy: rand(-30, 10), life: 0, max: 0.25 }); sfx.bossHit(); }
          break;
        }
      }
      if (!hit && boss && boss.shield > 0 && Math.hypot(b.x - boss.x, b.y - (boss.y - 15 * boss.sc)) < 17 * boss.sc) {
        hit = true; boss.shield--; boss.sflash = 0.08;
        parts.push({ t: 'p', x: b.x, y: b.y, vx: rand(-30, 30), vy: rand(-30, 10), life: 0, max: 0.25, blue: true });
        if (Math.random() < 0.3) sfx.shieldHit();
      } else if (!hit && boss && Math.hypot(b.x - boss.x, b.y - (boss.y - 14 * boss.sc)) < 9 * boss.sc) {
        hit = true; boss.hp--; boss.flash = 0.08;
        parts.push({ t: 'p', x: b.x, y: b.y, vx: rand(-30, 30), vy: rand(-30, 10), life: 0, max: 0.25 });
        if (Math.random() < 0.3) sfx.bossHit();
        if (boss.hp <= 0) killBoss();
      }
      if (hit || b.x < -10 || b.x > W + 10 || b.y < -10 || b.y > H + 10) bullets.splice(i, 1);
    }

    // thief touches hero
    for (let j = enemies.length - 1; j >= 0; j--) {
      const e = enemies[j];
      if (Math.hypot(e.x - P.x, (e.y - 12) - (P.y - 18)) < 13) {
        enemies.splice(j, 1); puff(e.x, e.y - 14);
        if (P.pow > 0) score++; else hurtPlayer();
      }
    }
  } else if (state === 'dying') {
    if (stateT > 1.0) endGame(false);
  }

  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.life += dt;
    if (p.life >= p.max) { parts.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.t === 's' || p.t === 'coin') { p.vy += 140 * dt; p.rot = (p.rot || 0) + dt * 6; }
    else { p.vx *= 0.92; p.vy *= 0.92; }
  }
}

// ---------------------------------------------------------------------------
// Rendering
// ---------------------------------------------------------------------------
const STAR_COLORS = ['#ffe14a', '#ff8fd0', '#6fe3ff', '#b6f23c'];
function shadowAt(x, y, rx) { el(ctx, x, y, rx, rx * 0.28, 'rgba(0,0,0,0.28)', null); }
function heroState(forceIdle, view) {
  return forceIdle
    ? { view: view || 'front', flip: false, ph: 0, run: false, br: breath(), gunA: 0.6, flash: 0 }
    : { view: P.view, flip: P.flip, ph: P.ph, run: P.run, br: P.run ? 0 : breath(), gunA: P.gunA, flash: P.flash };
}
function coinDraw(c, x, y, rot) {
  const w = Math.abs(Math.cos(rot)) * 2.6 + 0.5;
  el(c, x, y, w, 2.8, lg(c, x, y - 3, x, y + 3, ['#fff1a6', '#f5c534', '#b8860b']), OUT, 0.4);
  if (w > 1.5) tinyText(c, '$', x, y + 0.1, 3, '#a87a00');
}
function drawBullet(b) {
  const sp = Math.hypot(b.vx, b.vy) || 1, ux = b.vx / sp, uy = b.vy / sp;
  if (b.k === 'c') {
    line(ctx, b.x - ux * 7, b.y - uy * 7, b.x, b.y, 'rgba(90,208,255,0.45)', 2.6);
    line(ctx, b.x - ux * 5, b.y - uy * 5, b.x, b.y, '#dff6ff', 1);
  } else {
    const col = b.k === 'o' ? '255,140,40' : '255,210,60';
    line(ctx, b.x - ux * 6, b.y - uy * 6, b.x, b.y, `rgba(${col},0.35)`, 2);
    el(ctx, b.x, b.y, 2.1, 2.1, `rgba(${col},0.35)`, null);
    el(ctx, b.x, b.y, 1.2, 1.2, '#fffbe0', null);
  }
}

function render(now) {
  buttons = [];
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(bg, 0, 0);
  ctx.setTransform(S, 0, 0, S, 0, 0);
  ctx.save();
  if (shakeT > 0) ctx.translate(rand(-2, 2), rand(-2, 2));

  if (state !== 'menu') {
    const list = enemies.map(e => ({ y: e.y, e }));
    list.push({ y: P.y, p: true });
    if (boss) list.push({ y: boss.y, b: true });
    list.sort((a, b) => a.y - b.y);
    for (const it of list) {
      if (it.p) {
        shadowAt(P.x, P.y, 9);
        if (hero === 'girl' && P.pow > 0) {
          const r = 21 + Math.sin(now / 90) * 1.5;
          ctx.fillStyle = rg(ctx, P.x, P.y - 20, 4, r, ['rgba(255,240,160,0.55)', 'rgba(255,200,60,0.3)', 'rgba(255,200,60,0)']);
          ctx.beginPath(); ctx.arc(P.x, P.y - 20, r, 0, TAU); ctx.fill();
          for (let k = 0; k < 4; k++) {
            const a = now / 400 + k * Math.PI / 2;
            star(ctx, P.x + Math.cos(a) * 19, P.y - 20 + Math.sin(a) * 19, 1.8, '#fff3a0', null, 0, a * 2);
          }
        }
        // red tint instead of blinking: fades out over the invulnerability window
        const hurtK = state === 'dying' ? 0.6 : (P.inv > 0 ? 0.65 * Math.min(1, P.inv / 1.5 + 0.25) : 0);
        if (P.energy > 0) {
          ctx.save(); glow(ctx, '#7fff6a', 6);
          el(ctx, P.x, P.y, 11, 3.2, null, 'rgba(140,255,110,0.8)', 0.8);
          ctx.restore();
        }
        const st = heroState(false);
        let jy = 0;
        if (P.cel > 0) {
          jy = -Math.abs(Math.sin((CEL_TIME - P.cel) * 7)) * 9 * Math.min(1, P.cel);
          st.view = 'front'; st.happy = true; st.run = false; st.gunA = -Math.PI / 2 - 0.75;
        }
        P.sh = drawHero(ctx, hero, P.x, P.y + jy, 1, st);
        if (hurtK > 0) tintHero(hero, P.x, P.y + jy, st, hurtK);
        if (P.cel > 0) P.sh = [P.sh[0], P.sh[1] - jy];
      } else if (it.b) {
        const b = boss, sq = b.flash > 0 ? 1.06 : 1;
        shadowAt(b.x, b.y, 9 * b.sc);
        ctx.save(); ctx.translate(b.x, b.y);
        ctx.scale((b.flip ? -1 : 1) * b.sc * sq, b.sc / sq);
        if (b.dashT > 0) { ctx.globalAlpha = 0.35; ctx.save(); ctx.translate(-4, 0); drawMonster(ctx, BOSSES[b.tier].M, b.ph - 0.5); ctx.restore(); ctx.globalAlpha = 1; }
        drawMonster(ctx, BOSSES[b.tier].M, b.ph);
        if (b.flash > 0) { ctx.globalAlpha = 0.45; el(ctx, 0, -15, 12, 13.5, '#ffffff', null); ctx.globalAlpha = 1; }
        ctx.restore();
        if (b.shield > 0) drawBossShield(ctx, b, now);
      } else {
        const e = it.e;
        shadowAt(e.x, e.y, 7);
        ctx.save(); ctx.translate(e.x, e.y); if (e.flip) ctx.scale(-1, 1);
        drawThief(ctx, THIEF_V[e.v], e.ph);
        if (e.flash > 0) { ctx.globalAlpha = 0.5; el(ctx, 0, -15, 8, 11, '#ffffff', null); ctx.globalAlpha = 1; }
        ctx.restore();
        if (e.max > 1) {
          rr(ctx, e.x - 6, e.y - 36, 12, 2.4, 1.2, 'rgba(10,10,30,0.7)', OUT, 0.4);
          rr(ctx, e.x - 5.6, e.y - 35.6, 11.2 * e.hp / e.max, 1.6, 0.8, e.hp / e.max > 0.5 ? '#7fe35a' : '#ffb020', null);
        }
      }
    }
    if (hero === 'robot' && P.pow > 0) for (let k = 0; k < 6; k++) {
      const a = shieldA + k * Math.PI / 3;
      riotShield(ctx, P.x + Math.cos(a) * 25, P.y - 18 + Math.sin(a) * 25);
    }
    if (appleItem) {
      const a = appleItem;
      if (a.landed) el(ctx, a.x, a.y + 5.5, 5, 1.4, 'rgba(0,0,0,0.25)', null);
      if (a.landed && a.life < 3 && Math.floor(a.life * 8) % 2 === 0) { /* blink before vanishing */ }
      else {
        if (a.landed) { ctx.save(); glow(ctx, '#ffe14a', 6 + Math.sin(now / 150) * 3); apple(ctx, a.x, a.y + Math.sin(now / 250) * 0.8, 1.15); ctx.restore(); }
        else apple(ctx, a.x, a.y, 1.15);
      }
    }
    for (const k of coins) coinDraw(ctx, k.x, k.y, k.rot);
    for (const b of bullets) drawBullet(b);
  }
  for (const p of parts) {
    const k = p.life / p.max;
    if (p.t === 'c') {
      const r = Math.max(0.5, p.r * (0.6 + 0.9 * k));
      ctx.globalAlpha = 1 - k * k;
      el(ctx, p.x, p.y, r, r, rg(ctx, p.x - r * 0.3, p.y - r * 0.3, 0.5, r, ['#ffffff', '#eef2fa', '#c3cde0']), null);
      ctx.globalAlpha = 1;
    } else if (p.t === 's') {
      ctx.globalAlpha = k > 0.8 ? (1 - k) / 0.2 : 1;
      star(ctx, p.x, p.y, 2.6, STAR_COLORS[p.s], OUT, 0.4, p.rot);
      ctx.globalAlpha = 1;
    } else if (p.t === 'coin') {
      coinDraw(ctx, p.x, p.y, p.rot);
    } else if (p.t === 'g') {
      el(ctx, p.x, p.y, 1.1 * (1 - k) + 0.3, 1.1 * (1 - k) + 0.3, '#9dff7a', null);
    } else {
      el(ctx, p.x, p.y, 1.2 * (1 - k) + 0.3, 1.2 * (1 - k) + 0.3, p.blue ? '#bff2ff' : '#fff3a0', null);
    }
  }
  // Mariyam's victory speech bubble
  if (state !== 'menu' && P.cel > 0 && hero === 'girl') {
    const lines = ['Мама, Дадака,', 'я классно справилась!', 'Точно?'];
    const bw = 80, bh = 30, bx = Math.max(4, Math.min(W - bw - 4, P.x - bw / 2)), byy = Math.max(30 + safeTop, P.y - 92);
    ctx.globalAlpha = Math.min(1, P.cel * 2);
    rr(ctx, bx, byy, bw, bh, 8, '#ffffff', OUT, 0.9);
    ctx.beginPath(); ctx.moveTo(P.x - 4, byy + bh - 0.5); ctx.lineTo(P.x + 4, byy + bh - 0.5); ctx.lineTo(P.x, byy + bh + 7); ctx.closePath(); paint(ctx, '#ffffff', null);
    line(ctx, P.x - 4, byy + bh, P.x, byy + bh + 7, OUT, 0.9); line(ctx, P.x + 4, byy + bh, P.x, byy + bh + 7, OUT, 0.9);
    lines.forEach((l, i) => text(l, bx + bw / 2, byy + 7 + i * 8, i === 2 ? 8 : 7, i === 2 ? '#e0559a' : '#1f2b66', 'center', 0));
    ctx.globalAlpha = 1;
  }
  ctx.restore();

  if (state === 'play' || state === 'dying' || state === 'pause') drawHUD(now);
  if (state === 'pause') drawPause(now);
  if (state === 'menu') drawMenu(now);
  if (state === 'over') drawOver(now);
  if (state === 'win') drawWin(now);
}

function drawHUD(now) {
  const top = 7 + safeTop;
  // pause button
  pauseBtn = { x: 10, y: top + 0.5, r: 10 };
  el(ctx, 10, top + 0.5, 6.5, 6.5, lg(ctx, 0, top - 6, 0, top + 7, ['#5a6bd6', '#24316f']), OUT, 0.7);
  rr(ctx, 7.6, top - 2.4, 1.6, 5.8, 0.6, '#ffffff', null); rr(ctx, 10.8, top - 2.4, 1.6, 5.8, 0.6, '#ffffff', null);
  rr(ctx, 19, top - 5, 42, 11, 5.5, 'rgba(10,14,48,0.45)', null);
  star(ctx, 25, top + 0.5, 4, lg(ctx, 0, top - 4, 0, top + 4, ['#fff1a6', '#f5c534', '#b8860b']), OUT, 0.5);
  text(String(score), 31, top + 0.8, 9, '#ffffff', 'left');
  for (let i = 0; i < 3; i++) {
    const hx = W - 9 - (2 - i) * 11;
    heartPath(ctx, hx, top, 4.2);
    paint(ctx, i < P.lives ? lg(ctx, 0, top - 4, 0, top + 4, ['#ff8a8a', '#e8363c', '#a51d24']) : 'rgba(60,60,80,0.8)', OUT, 0.6);
    if (i < P.lives) el(ctx, hx - 1.6, top - 1.4, 0.9, 0.7, 'rgba(255,255,255,0.7)', null);
  }
  text('ГЛАВА ' + chapterOf(wave) + ' · ВОЛНА ' + wave + '/' + WAVES, W / 2, top - 1, 6.5, '#ffffff');
  // chapter progress: 5 wave segments + the boss crown
  {
    const wi = (wave - 1) % WAVES_PER_CHAPTER;
    let f = waveClear ? 1 : 1 - (toSpawn + enemies.length) / waveCount(wave);
    if (wi === WAVES_PER_CHAPTER - 1 && boss) f = 1;
    f = Math.max(0, Math.min(1, f));
    const bw = Math.min(110, W * 0.46), sx = W / 2 - bw / 2 - 5, y = top + 5.5, seg = (bw - 4 * 1.5) / WAVES_PER_CHAPTER;
    for (let i = 0; i < WAVES_PER_CHAPTER; i++) {
      const x = sx + i * (seg + 1.5), fill = i < wi ? 1 : (i === wi ? f : 0);
      rr(ctx, x, y, seg, 3.2, 1.6, 'rgba(10,10,30,0.6)', OUT, 0.4);
      if (fill > 0) rr(ctx, x + 0.4, y + 0.4, (seg - 0.8) * fill, 2.4, 1.2, lg(ctx, 0, y, 0, y + 3, ['#d6ff9a', '#7fe35a', '#3fa52a']), null);
    }
    ctx.save(); if (boss) glow(ctx, '#ffd23f', 6);
    ctx.globalAlpha = (wi === WAVES_PER_CHAPTER - 1 && (boss || bossPending)) || boss ? 1 : 0.5;
    crown(ctx, sx + bw + 6, y + 4, 7);
    ctx.restore();
  }
  if (boss) {
    const bw = Math.min(150, W * 0.66), bx = W / 2 - bw / 2;
    let by = top + 17;
    text(BOSSES[boss.tier].name, W / 2, by, 7, '#ffb3b3');
    if (boss.maxShield) {
      by += 5;
      rr(ctx, bx, by, bw, 4, 2, 'rgba(10,10,30,0.7)', OUT, 0.5);
      rr(ctx, bx + 0.5, by + 0.5, Math.max(0, (bw - 1) * boss.shield / boss.maxShield), 3, 1.5, lg(ctx, 0, by, 0, by + 4, ['#dff8ff', '#5ad0ff', '#1a7fc0']), null);
      text('ЩИТ ' + boss.shield, bx + bw + 2, by + 2, 5, '#bff2ff', 'left');
      by += 1;
    }
    rr(ctx, bx, by + 4, bw, 5, 2.5, 'rgba(10,10,30,0.7)', OUT, 0.6);
    rr(ctx, bx + 0.6, by + 4.6, Math.max(0, (bw - 1.2) * boss.hp / boss.max), 3.8, 1.9, lg(ctx, 0, by + 4, 0, by + 9, ['#ff8a8a', '#e8363c', '#9a1520']), null);
  }
  // apple energy indicator
  if (P.energy > 0) {
    apple(ctx, W - 37, top + 13, 0.8);
    text(Math.ceil(P.energy) + ' c', W - 31, top + 13.5, 6.5, '#9dff7a', 'left');
  }
  // banners
  const cy = P.cel > 0 ? H * 0.64 : H * 0.34; // move banners below Mariyam's cheer bubble
  if (waveClear) {
    text('ВОЛНА ' + wave + ' ПРОЙДЕНА!', W / 2, cy, 13, '#b6f23c');
    if (Math.floor(now / 250) % 2) text('+1 сердечко', W / 2, cy + 16, 9, '#ff8fd0');
  } else if (boss && bossIntroT < 2.2) {
    text('БОСС!', W / 2, cy, 24, lg(ctx, 0, cy - 12, 0, cy + 12, ['#ffd0d0', '#ff4d4d', '#b3141f']));
    text(BOSSES[boss.tier].name, W / 2, cy + 20, 11, '#ffffff');
  } else if (waveT < 2) {
    if ((wave - 1) % WAVES_PER_CHAPTER === 0) {
      text('ГЛАВА ' + chapterOf(wave), W / 2, cy - 4, 20, lg(ctx, 0, cy - 14, 0, cy + 6, ['#fff1a6', '#f5c534', '#c9971c']));
      text(THEMES[themeOf(wave)].name, W / 2, cy + 14, 10, '#ffffff');
      text('Волна ' + wave, W / 2, cy + 28, 8, '#b6f23c');
    } else text('ВОЛНА ' + wave, W / 2, cy, 18, lg(ctx, 0, cy - 10, 0, cy + 10, ['#fff1a6', '#f5c534', '#c9971c']));
  }
  drawPowerButton(now);
}

// Draws a red-tinted copy of the hero over the normal one (offscreen mask, works without ctx.filter)
const tintCv = document.createElement('canvas'), tintCtx = tintCv.getContext('2d');
function tintHero(who, x, y, st, k) {
  const BW = 90, BH = 90, OX = 45, OY = 68, px = Math.ceil(BW * S), py = Math.ceil(BH * S);
  if (tintCv.width !== px || tintCv.height !== py) { tintCv.width = px; tintCv.height = py; }
  const c = tintCtx;
  c.setTransform(1, 0, 0, 1, 0, 0); c.globalCompositeOperation = 'source-over'; c.clearRect(0, 0, px, py);
  c.setTransform(S, 0, 0, S, 0, 0);
  drawHero(c, who, OX, OY, 1, st);
  c.setTransform(1, 0, 0, 1, 0, 0);
  c.globalCompositeOperation = 'source-atop'; c.fillStyle = '#ff2a2a'; c.fillRect(0, 0, px, py);
  c.globalCompositeOperation = 'source-over';
  ctx.save(); ctx.globalAlpha = k; ctx.drawImage(tintCv, x - OX, y - OY, BW, BH); ctx.restore();
}

function drawPowerButton(now) {
  const r = 15, cx = W - r - 9, cy = H - r - 11;
  powerBtn = { x: cx, y: cy, r: r + 6 };
  const ready = P.pow <= 0 && P.cd <= 0, active = P.pow > 0;
  const col = hero === 'girl' ? ['#fff1a6', '#f5c534', '#b8860b'] : ['#bfe6ff', '#3f9bff', '#1a4fb0'];
  el(ctx, cx, cy + 1.5, r + 1.5, r + 1.5, 'rgba(0,0,0,0.35)', null);
  if (ready || active) { ctx.save(); glow(ctx, col[1], 10); }
  el(ctx, cx, cy, r, r, ready || active ? rg(ctx, cx - 4, cy - 5, 1, r * 1.3, active ? ['#ffffff', '#ffd6ef', '#ff8fd0'] : col) : rg(ctx, cx - 4, cy - 5, 1, r * 1.3, ['#8a90a5', '#4a4f63', '#2d3140']), OUT, 0.9);
  if (ready || active) ctx.restore();
  const k = active ? P.pow / POWER_TIME[hero] : (P.cd > 0 ? 1 - P.cd / POWER_CD : 1);
  arcS(ctx, cx, cy, r + 2.6, -Math.PI / 2, -Math.PI / 2 + TAU * k, active ? '#ff8fd0' : col[1], 2.2);
  ctx.globalAlpha = ready || active ? 1 : 0.55;
  if (hero === 'girl') { boltPath(ctx, cx, cy, 1.5); paint(ctx, lg(ctx, 0, cy - 9, 0, cy + 9, ['#ffffff', '#fff1a6']), OUT, 0.7); }
  else { ctx.save(); ctx.translate(cx, cy); ctx.scale(1.1, 1.1); riotShield(ctx, 0, 0); ctx.restore(); }
  ctx.globalAlpha = 1;
  if (ready && Math.floor(now / 300) % 2) text('СУПЕР!', cx, cy - r - 9, 8, col[1]);
  else if (P.cd > 0) text(String(Math.ceil(P.cd)), cx, cy - r - 9, 8, '#ffffff');
}

function drawButton(label, cy, act, quiet) {
  ctx.font = `bold 11px ${FONT}`;
  const w = Math.max(92, ctx.measureText(label).width + 30), h = 24, x = W / 2 - w / 2, y = cy - h / 2;
  const press = quiet ? 0 : (Math.sin(performance.now() / 250) + 1) * 0.6;
  rr(ctx, x, y + 2.5, w, h, 9, '#8a6410', OUT, 0.8);
  rr(ctx, x, y + press, w, h, 9, lg(ctx, 0, y, 0, y + h, quiet ? ['#e8eefc', '#b9c4de'] : ['#fff1a6', '#f5c534', '#d9a11f']), OUT, 0.8);
  rr(ctx, x + 4, y + 2 + press, w - 8, 4, 2, 'rgba(255,255,255,0.45)', null);
  text(label, W / 2, y + h / 2 + press + 0.5, 11, '#1f2b66', 'center', 0);

}

function overlay(a) {
  ctx.fillStyle = lg(ctx, 0, 0, 0, H, [`rgba(8,10,40,${a})`, `rgba(8,10,40,${a * 0.6})`, `rgba(8,10,40,${a})`]);
  ctx.fillRect(0, 0, W, H);
}
function drawMenu(now) {
  overlay(0.55);
  const ts = Math.min(22, W / 9.5), ty = Math.max(H * 0.09, 16) + safeTop;

  });
  const short = H < 260, by = cardTop + ch + (short ? 16 : 20), gap2 = short ? 9 : 11;

// ---------------------------------------------------------------------------
// Input: finger / mouse drag. The hero runs in the direction the pointer is
// moving and stops when it stops or is released.
// ---------------------------------------------------------------------------
const toWorld = e => [e.clientX * DPR / S, e.clientY * DPR / S];
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  initAudio();
  const [x, y] = toWorld(e);
  if (state === 'menu' || state === 'over' || state === 'win' || state === 'pause') {
    for (const b of buttons) if (x >= b.x - 3 && x <= b.x + b.w + 3 && y >= b.y - 3 && y <= b.y + b.h + 3) { b.act(); break; }
    return;
  }
  if (state !== 'play') return;
  if (Math.hypot(x - pauseBtn.x, y - pauseBtn.y) <= pauseBtn.r) { pauseGame(); return; }
  if (Math.hypot(x - powerBtn.x, y - powerBtn.y) <= powerBtn.r) { activatePower(); return; }
  ptr.active = true; ptr.id = e.pointerId; ptr.lx = e.clientX; ptr.ly = e.clientY; ptr.last = 0;
  try { cv.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
});
cv.addEventListener('pointermove', e => {
  if (!ptr.active || e.pointerId !== ptr.id) return;
  e.preventDefault();
  const dx = e.clientX - ptr.lx, dy = e.clientY - ptr.ly, d = Math.hypot(dx, dy);
  if (d >= 4) {
    let nx = dx / d, ny = dy / d;
    if (performance.now() - ptr.last < 150) { nx = ptr.dx * 0.35 + nx * 0.65; ny = ptr.dy * 0.35 + ny * 0.65; const n = Math.hypot(nx, ny) || 1; nx /= n; ny /= n; }
    ptr.dx = nx; ptr.dy = ny; ptr.lx = e.clientX; ptr.ly = e.clientY; ptr.last = performance.now();
  }
});
const release = e => { if (e.pointerId === ptr.id) ptr.active = false; };
cv.addEventListener('pointerup', release);
cv.addEventListener('pointercancel', release);
cv.addEventListener('lostpointercapture', release);
window.addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); activatePower(); }
  if (e.code === 'Escape' || e.code === 'KeyP') { if (state === 'play') pauseGame(); else if (state === 'pause') resumeGame(); }
});
document.addEventListener('visibilitychange', () => { if (document.hidden) pauseGame(); });
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
document.addEventListener('touchstart', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());
document.addEventListener('contextmenu', e => e.preventDefault());

// ---------------------------------------------------------------------------
// Resize & main loop
// ---------------------------------------------------------------------------
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  const vw = window.innerWidth, vh = window.innerHeight;
  cv.width = Math.round(vw * DPR); cv.height = Math.round(vh * DPR);
  cv.style.width = vw + 'px'; cv.style.height = vh + 'px';
  S = Math.min(cv.width, cv.height) / 230;
  W = cv.width / S; H = cv.height / S;
  const st = parseFloat(getComputedStyle(document.getElementById('safe')).paddingTop) || 0;
  safeTop = st * DPR / S;
  buildBg(state === 'menu' ? 0 : themeOf(wave));
  P.x = Math.max(10, Math.min(W - 10, P.x));
  P.y = Math.max(playTop + 44, Math.min(H - 2, P.y));
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 200));
resize();
P.x = W / 2; P.y = Math.round(H * 0.62);

let last = performance.now();
function frame(now) {
  let dt = (now - last) / 1000; last = now;
  if (dt > 0.05) dt = 0.05;
  update(dt, now);
  render(now);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// Debug hook for automated checks (harmless in normal play).
window.__game = {
  get state() { return state; }, P, get enemies() { return enemies; }, get score() { return score; },
  get wave() { return wave; }, set wave(v) { startWave(v); }, get boss() { return boss; },
  start: startGame, menu: toMenu, power: activatePower, pause: pauseGame, resume: resumeGame, drawMonster, voiceTest: () => fetch(VOICE).then(r => r.arrayBuffer()).then(b => new (window.AudioContext || window.webkitAudioContext)().decodeAudioData(b)).then(x => x.duration), get apple() { return appleItem; }, set appleT(v) { appleT = v; }, drawHero, drawThief, BOSSES, THIEF_V, set hero(v) { hero = v; }, spawn: () => spawnEnemy(20)
};
})();
